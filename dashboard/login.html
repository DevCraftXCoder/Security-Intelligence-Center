<!DOCTYPE html>
<html lang="en" style="background:#050505">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SIC — Sign In</title>
<!-- Improvement 15: SVG favicon -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23050505'/><text x='4' y='24' font-size='20' font-weight='900' fill='%23e94560'>S</text></svg>">
<link rel="stylesheet" href="/dashboard/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,400&family=JetBrains+Mono:wght@400;500;700&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,400&family=JetBrains+Mono:wght@400;500;700&display=swap"></noscript>
<style>
/* Improvements 9, 14 for login page */

/* Improvement 9: canonical primary button */
.sic-btn--primary {
  background: var(--sic-accent) !important;
  color: #fff !important;
  border: none !important;
  padding: 10px 20px !important;
  font-family: var(--sic-font-body) !important;
  font-weight: 600 !important;
  border-radius: 0 !important;
  width: 100%;
  position: relative;
  overflow: hidden;
  transition: filter 0.2s ease;
}
.sic-btn--primary:hover {
  filter: brightness(1.12);
}
/* button shimmer sweep on hover */
.sic-btn--primary::after {
  content: '';
  position: absolute;
  top: 0; left: -100%;
  width: 60%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
  transition: left 0.4s ease;
  pointer-events: none;
}
.sic-btn--primary:hover::after {
  left: 150%;
}

/* Improvement 14: focus states */
:focus-visible {
  outline: 1px solid var(--sic-accent) !important;
  outline-offset: 2px !important;
}
/* email input red glow on focus */
.sic-input:focus {
  box-shadow: 0 0 0 1px rgba(233,69,96,0.5), 0 0 12px rgba(233,69,96,0.15) !important;
  outline: none !important;
  border-color: rgba(233,69,96,0.6) !important;
}

/* Improvement 5: login form card — correct token + scan-line texture */
.sic-form {
  background: #0f0f0f;
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 0 !important;
  position: relative;
}
/* scan-line overlay — ultra-thin horizontal lines for hacker feel */
.sic-form::before {
  content: '';
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 3px,
    rgba(255,255,255,0.012) 3px,
    rgba(255,255,255,0.012) 4px
  );
  pointer-events: none;
  border-radius: 0;
}

/* page fade-in on load */
@keyframes sic-page-fadein {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}
.sic-form-page {
  animation: sic-page-fadein 0.45s ease forwards;
}

/* Step 1: SIC logo on login page — enhanced inline svg wordmark */
@keyframes sic-logo-float {
  0%, 100% { transform: translateY(0px); }
  50%       { transform: translateY(-8px); }
}
.sic-login-logo {
  text-align: center;
  margin-bottom: 20px;
  cursor: pointer;
}
.sic-login-logo img {
  animation: sic-logo-float 3s ease-in-out infinite;
  filter: drop-shadow(0 0 6px rgba(255,255,255,0.25));
  transition: filter 0.3s ease;
}
.sic-login-logo:hover img {
  filter: drop-shadow(0 0 16px rgba(255,255,255,0.85)) drop-shadow(0 0 32px rgba(255,255,255,0.4));
}
.sic-login-logo .sic-header__logo {
  font-size: 28px;
  letter-spacing: 2px;
  display: inline-flex;
  align-items: center;
  gap: 8px;
}
/* subtitle slow-pulse */
@keyframes sic-subtitle-pulse {
  0%, 100% { opacity: 0.4; }
  50%       { opacity: 0.65; }
}
.sic-login-logo [style*="Security Intelligence Center"] {
  animation: sic-subtitle-pulse 4s ease-in-out infinite;
}
</style>
</head>
<body data-page="login" style="background:#050505">
<canvas id="galaxy-canvas"></canvas>
<div id="glitch-vignette"></div>

<main class="sic-form-page">
  <!-- Logo -->
  <div class="sic-login-logo" id="login-bg-cycle" role="button" tabindex="0"
       title="Click to cycle background">
    <img src="/assets/sic-logo.png" alt="SIC" style="height:140px;width:140px;object-fit:cover;border-radius:50%;display:block;margin:0 auto 12px;">
    <div style="color:rgba(255,255,255,0.4);font-size:10px;font-weight:500;letter-spacing:3px;text-transform:uppercase;text-align:center;font-family:'DM Sans',sans-serif;">Security Intelligence Center</div>
  </div>

  <form id="login-form" class="sic-form" autocomplete="email">
    <label for="email" class="sic-label">Admin email</label>
    <input id="email" name="email" type="email" class="sic-input" required autofocus>
    <!-- Improvement 9: canonical primary button -->
    <button type="submit" class="sic-btn sic-btn--primary">Send magic link</button>
    <div id="login-msg"></div>
  </form>
</main>
<script src="/dashboard/app.js"></script>
</body>
</html>
