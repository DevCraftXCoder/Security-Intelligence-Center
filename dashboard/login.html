<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SIC — Sign In</title>
<link rel="stylesheet" href="/dashboard/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,400&family=JetBrains+Mono:wght@400;500;700&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,400&family=JetBrains+Mono:wght@400;500;700&display=swap"></noscript>
</head>
<body data-page="login">
<canvas id="galaxy-canvas"></canvas>
<div id="glitch-vignette"></div>

<main class="sic-form-page">
  <div class="sic-login-logo" id="login-bg-cycle" role="button" tabindex="0"
       title="Click to cycle background">
    <span class="sic-header__logo" id="logo-text">SIC</span>
    <img class="sic-login-logo__img" id="logo-img" alt="SIC Logo" style="display:none">
    <input type="file" id="logo-file" accept="image/*" style="display:none" aria-hidden="true">
  </div>

  <form id="login-form" class="sic-form" autocomplete="email">
    <p class="sic-stat__label" style="text-align:center;margin-bottom:4px">Security Intelligence Center</p>
    <label for="email">Admin email</label>
    <input id="email" name="email" type="email" class="sic-input" required autofocus>
    <button type="submit" class="sic-btn sic-btn--primary">Send magic link</button>
    <div id="login-msg"></div>
  </form>
</main>
<script src="/dashboard/app.js"></script>
</body>
</html>
